name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --locked

  compatibility:
    name: Compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # Starts the real basis-server-rs and checks the C# compatibility contract end to end:
      # config.xml schema v19 / upgrade, permissions seeding, log shape, health and REST statuses,
      # the unconnected server-info UDP query, and the structured reject payloads.
      # The full C# harness lives in the Unity workspace (it references BasisNetworkClient and
      # BasisNetworkServer), so it cannot be built here; scripts/run-compat.ps1 remains the
      # local/self-hosted check for that side.
      - name: Run compatibility suite
        run: cargo test -p basis-server --test compat_e2e --locked -- --test-threads=1

  upstream-conformance:
    name: Official Basis conformance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Rust server
        uses: actions/checkout@v4

      - name: Checkout pinned official Basis source
        uses: actions/checkout@v4
        with:
          repository: BasisVR/Basis
          ref: d8b718d4fb6a16e6f2339d4431ffd1212d97c69d
          path: upstream/Basis

      - name: Verify fixture against official source and tests
        run: python3 scripts/verify_upstream_basis_contract.py --upstream-root upstream/Basis

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run the complete official Basis server test suite
        working-directory: upstream/Basis
        run: >
          dotnet test "Basis Server/BasisServerTests/BasisServerTests.csproj"
          --configuration Release

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Compare Rust output with official C# test fixture
        run: >
          cargo test -p basis-transport --locked
          global_lock_state_matches_the_official_basis_csharp_test_fixture

  build:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --workspace --release --locked
